name: Claude Code - PR Review (Reusable)

on:
  workflow_call:
    inputs:
      prompt:
        description: 'Optional prompt override for the review. Leave empty for the default review prompt.'
        required: false
        type: string
        default: |
          Please review this pull request and provide constructive feedback. Focus on:
          - Code quality, readability, and style
          - Potential bugs, logic errors, and edge cases
          - Security concerns
          - Performance considerations
          - Test coverage and missing tests

          Post the review as a single PR comment. Be specific and reference file paths and line numbers.
      claude_args:
        description: 'Optional Claude Code CLI arguments. Defaults to read-only tools suitable for reviews.'
        required: false
        type: string
        default: '--allowed-tools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Read,Grep,Glob"'
    secrets:
      claude_code_oauth_token:
        description: 'OAuth token for Claude Code.'
        required: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          prompt: ${{ inputs.prompt }}
          claude_args: ${{ inputs.claude_args }}
