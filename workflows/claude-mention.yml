name: Claude Code - Mention (Reusable)

on:
  workflow_call:
    inputs:
      prompt:
        description: 'Optional prompt override for Claude. Leave empty to let the action build a default prompt from the triggering event.'
        required: false
        type: string
        default: ''
      claude_args:
        description: 'Optional Claude Code CLI arguments (e.g. --allowed-tools, --max-turns).'
        required: false
        type: string
        default: ''
    secrets:
      claude_code_oauth_token:
        description: 'OAuth token for Claude Code.'
        required: true

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          prompt: ${{ inputs.prompt }}
          claude_args: ${{ inputs.claude_args }}
